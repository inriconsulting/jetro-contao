name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        contao: ['5.3.*', '5.7.*']
        exclude:
          - php: '8.2'
            contao: '5.7.*'
    name: PHP ${{ matrix.php }} / Contao ${{ matrix.contao }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, gd, zip, pdo_sqlite
          coverage: none
      - name: Abhängigkeiten
        run: |
          composer require --no-update "contao/core-bundle:${{ matrix.contao }}" "contao/calendar-bundle:${{ matrix.contao }}"
          composer update --no-interaction --no-progress --prefer-dist
      - name: Syntax
        run: find src contao -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPUnit
        run: vendor/bin/phpunit
