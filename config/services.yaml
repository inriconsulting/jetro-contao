services:
    _defaults:
        autowire: true
        autoconfigure: true

    JetroTools\ContaoBundle\:
        resource: ../src/
        exclude:
            - ../src/ContaoManager/
            - ../src/DependencyInjection/
            - ../src/JetroToolsContaoBundle.php
            - ../src/Api/ApiException.php
            - ../src/Api/EventData.php

    JetroTools\ContaoBundle\Api\ApiController:
        arguments:
            $version: '%jetro_contao.version%'

    JetroTools\ContaoBundle\Api\SluggerInterface: '@JetroTools\ContaoBundle\Contao\ContaoSlugger'
    JetroTools\ContaoBundle\Api\LabelProviderInterface: '@JetroTools\ContaoBundle\Contao\ContaoLabelProvider'
    JetroTools\ContaoBundle\Storage\MediaStorageInterface: '@JetroTools\ContaoBundle\Contao\ContaoMediaStorage'

    # Backend-Aktionen werden über $GLOBALS['BE_MOD'] per Klassenname aufgerufen
    JetroTools\ContaoBundle\Backend\TokenAction:
        public: true
